<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#0b0c10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sasha &amp; Masha | Заметки</title>
  <!-- published 2026-09-12-1635 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("sasha-theme") || "dark";
  </script>
  <link rel="stylesheet" href="styles.css?v=18" />
</head>
<body>
  <header class="site-chrome">
    <div class="brand">
      <span class="logo">Sasha <em>&amp;</em> Masha</span>
      <nav class="notes-nav" aria-label="Разделы заметок">
        <a class="notes-nav-link" href="#дела" data-nav="active">Дела</a>
        <a class="notes-nav-link" href="#архив" data-nav="archive">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M6 8V6.8A1.8 1.8 0 0 1 7.8 5h8.4A1.8 1.8 0 0 1 18 6.8V8M8 8v11.2A1.8 1.8 0 0 0 9.8 21h4.4a1.8 1.8 0 0 0 1.8-1.8V8M10 12h4"/></svg>
          <span class="notes-nav-label">Архив</span>
          <span class="notes-nav-count" data-archive-count hidden>0</span>
        </a>
      </nav>
    </div>
    <div class="chrome-actions">
      <span class="sync-status" data-sync aria-live="polite">сохраняется здесь</span>
      <div class="who-now" data-who-box></div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">Светлая</button>
      <a class="home-link" href="https://mariasedovav.github.io/sasha-masha/" aria-label="На главную">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.2 12 4.8l7.5 6.4V20a1 1 0 0 1-1 1h-5.2v-6.2H10.7V21H5.5a1 1 0 0 1-1-1v-8.8Z"/></svg>
      </a>
    </div>
  </header>

  <div class="archive-bar" data-archive-bar hidden>
    <label class="archive-search">
      <span class="visually-hidden">Поиск по архиву</span>
      <input type="search" data-archive-search maxlength="120" placeholder="Найти сделанное дело…" enterkeyhint="search" />
    </label>
    <p class="archive-hint">Через месяц после «сделано» дело само приходит сюда. Новый срок снимает перечёркивание и возвращает его в список.</p>
  </div>

  <main class="boards" id="boards">
    <section class="board board-sasha" data-person="sasha">
      <header class="board-head">
        <div>
          <p class="eyebrow">его список</p>
          <h2>Саша</h2>
        </div>
        <div class="board-tools">
          <span class="count" data-count>0 открытых</span>
          <button type="button" class="clear-btn" data-clear>Очистить</button>
        </div>
      </header>
      <form class="composer" data-form>
        <input type="text" maxlength="180" placeholder="Новое дело…" aria-label="Новое дело Саши" autocomplete="off" enterkeyhint="done" />
        <button type="button" class="mic-btn" data-mic aria-label="Голосовой ввод">Голос</button>
        <button type="submit">Добавить</button>
      </form>
      <ul class="tasks" data-list></ul>
    </section>

    <div class="boards-split" aria-hidden="true"><em>&amp;</em></div>

    <section class="board board-masha" data-person="masha">
      <header class="board-head">
        <div>
          <p class="eyebrow">её список</p>
          <h2>Маша</h2>
        </div>
        <div class="board-tools">
          <span class="count" data-count>0 открытых</span>
          <button type="button" class="clear-btn" data-clear>Очистить</button>
        </div>
      </header>
      <form class="composer" data-form>
        <input type="text" maxlength="180" placeholder="Новое дело…" aria-label="Новое дело Маши" autocomplete="off" enterkeyhint="done" />
        <button type="button" class="mic-btn" data-mic aria-label="Голосовой ввод">Голос</button>
        <button type="submit">Добавить</button>
      </form>
      <ul class="tasks" data-list></ul>
    </section>
  </main>

  <script src="https://mariasedovav.github.io/sasha-masha/voice-mic.js?v=1"></script>
  <script src="sync.js?v=13"></script>
  <script src="app.js?v=26"></script>
  <script src="assistant.js?v=18"></script>
</body>
</html>
