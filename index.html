<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sasha &amp; Masha | Заметки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("sasha-theme") || "dark";
  </script>
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <header class="site-chrome">
    <div class="brand">
      <span class="logo">Sasha <em>&amp;</em> Masha</span>
      <span class="brand-rest"><span class="brand-sep">|</span> <span class="brand-page">Заметки</span></span>
    </div>
    <div class="chrome-actions">
      <span class="sync-status" data-sync aria-live="polite">сохраняется здесь</span>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">Светлая</button>
      <a class="home-link" href="https://mariasedovav.github.io/sasha-masha/" aria-label="На главную">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.2 12 4.8l7.5 6.4V20a1 1 0 0 1-1 1h-5.2v-6.2H10.7V21H5.5a1 1 0 0 1-1-1v-8.8Z"/></svg>
      </a>
    </div>
  </header>

  <main class="boards" id="boards">
    <section class="board board-sasha" data-person="sasha">
      <header class="board-head">
        <div>
          <p class="eyebrow">его список</p>
          <h2>Саша</h2>
        </div>
        <div class="board-tools">
          <span class="count" data-count>0 открытых</span>
          <button type="button" class="clear-btn" data-clear>Очистить</button>
        </div>
      </header>
      <form class="composer" data-form>
        <input type="text" maxlength="180" placeholder="Новое дело…" aria-label="Новое дело Саши" autocomplete="off" enterkeyhint="done" />
        <button type="button" class="mic-btn" data-mic aria-label="Голосовой ввод">Голос</button>
        <button type="submit">Добавить</button>
      </form>
      <ul class="tasks" data-list></ul>
    </section>

    <div class="boards-split" aria-hidden="true"><em>&amp;</em></div>

    <section class="board board-masha" data-person="masha">
      <header class="board-head">
        <div>
          <p class="eyebrow">её список</p>
          <h2>Маша</h2>
        </div>
        <div class="board-tools">
          <span class="count" data-count>0 открытых</span>
          <button type="button" class="clear-btn" data-clear>Очистить</button>
        </div>
      </header>
      <form class="composer" data-form>
        <input type="text" maxlength="180" placeholder="Новое дело…" aria-label="Новое дело Маши" autocomplete="off" enterkeyhint="done" />
        <button type="button" class="mic-btn" data-mic aria-label="Голосовой ввод">Голос</button>
        <button type="submit">Добавить</button>
      </form>
      <ul class="tasks" data-list></ul>
    </section>
  </main>

  <script src="sync.js?v=10"></script>
  <script src="app.js?v=9"></script>
  <script src="assistant.js?v=10"></script>
</body>
</html>
